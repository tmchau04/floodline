<head>
<meta charset="UTF-8" />

<title>Ráng Mỡ Gà: Có Nhà Thì Giữ — Người Chơi</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#162b2c;
    --panel:#fffdf6;
    --ink:#273835;
    --muted:#5c706b;
    --accent:#e59a2d;
    --accent-dark:#b87112;
    --ok:#2e7d5b;
    --warn:#c45b28;
    --border:#cbb792;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  body.shaking{animation:shakeScreen 0.25s infinite;}
  @keyframes shakeScreen{
    0%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}
    75%{transform:translate(-2px,-3px)}
    100%{transform:translate(0,0)}
  }

  .wrap{max-width:920px;margin:0 auto;padding:16px}
  .topbar{
    display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;
    background:#1f3d3e;color:#fff6dc;padding:12px 16px;border-radius:14px;
    border:2px solid #7d623e;margin-bottom:14px;
  }
  .brandTitle{font-weight:900;font-size:17px;letter-spacing:0.3px}
  .brandSub{font-size:12px;color:#f5d58b}
  .hudPill{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip{
    background:#122425;color:#ffeab8;border:1px solid #8a6c44;
    padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:700;
  }
  .panel{
    background:var(--panel);border:2px solid var(--border);border-radius:16px;
    padding:18px;box-shadow:0 10px 28px rgba(0,0,0,0.22);margin-bottom:14px;
  }
  .card{
    background:#faf4e4;border:1.5px solid #d4bf99;border-radius:12px;
    padding:14px;margin-bottom:12px;
  }
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
  .hr{height:1px;background:#dfd0b2;margin:12px 0}
  .small{font-size:12.5px;color:var(--muted)}
  .ok{color:var(--ok);font-weight:750}
  .warnText{color:var(--warn);font-weight:750}
  .pill{
    display:inline-block;background:#f7dfb0;color:#4a2f0b;border:1px solid #d4a657;
    padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;
  }
  input,select,button{
    font-family:inherit;font-size:14px;border-radius:10px;border:1.5px solid #b9a176;
  }
  input,select{padding:9px 12px;background:#fff;color:var(--ink)}
  button{
    padding:9px 14px;font-weight:800;cursor:pointer;background:#f4e8ca;color:var(--ink);
    transition:transform 0.08s ease, filter 0.12s ease;
  }
  button:hover:not(:disabled){filter:brightness(1.04)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:0.45;cursor:not-allowed}
  button.primary{
    background:linear-gradient(180deg,#f9cf66,#e19424);
    border-color:#9e6110;color:#2b1a05;
  }
  button.warn{
    background:linear-gradient(180deg,#f59e6c,#cf5a25);
    border-color:#8a350e;color:#fff;
  }

  /* ĐỒNG HỒ ĐẾM NGƯỢC TRỰC TIẾP TRONG CÁC PHẦN CHƠI */
  .stageTimerRow{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#234747;color:#fff6dc;border:2px solid #96734e;
    border-radius:11px;padding:9px 13px;margin-bottom:12px;
    font-size:13.5px;font-weight:800;
  }
  .stageTimerNum{
    background:#f6c95e;color:#2b1d0e;padding:3px 10px;border-radius:8px;
    font-weight:900;font-size:14px;letter-spacing:0.4px;
  }

  /* BA LÔ 90 GIÂY */
  .bagGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:10px 0}
  .bagItem{
    border:2px solid #cbb792;border-radius:12px;padding:10px;background:#fffdf6;
    cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
  }
  .bagItem.selected{border-color:#2e7d5b;background:#e6f6ee}
  .bagItemHead{display:flex;justify-content:space-between;gap:6px;font-weight:800;font-size:13.5px}

  /* BẢNG TIN & BÌNH CHỌN */
  .newsCard{
    background:#fffdf6;border:1.5px solid #d4bf99;border-radius:11px;padding:12px;margin-bottom:10px;
  }
  .newsHeader{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .trustBadge{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px}
  .trust-high{background:#daf3e6;color:#1e6343}
  .trust-mid{background:#fff0c8;color:#7a4f06}
  .trust-low{background:#fde0d8;color:#9a2b14}

  /* KÉO THẢ SẮP XẾP THỨ TỰ ƯU TIÊN CHECKLIST */
  .prioHintCard{
    background:#fdf3d7;border:2px solid #cfa96e;border-radius:11px;
    padding:11px 13px;margin-bottom:10px;font-size:13.5px;line-height:1.5;
  }
  .prioList{display:flex;flex-direction:column;gap:8px;margin:10px 0 14px}
  .prioItem{
    display:flex;align-items:center;gap:10px;background:#fffdf6;
    border:2px solid #cbb792;border-radius:11px;padding:10px 12px;
    transition:transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
    touch-action:none;
  }
  .prioItem.dragging{
    opacity:0.94;transform:scale(1.02);border-color:#2e7d5b;
    box-shadow:0 10px 22px rgba(0,0,0,0.22);background:#eaf7f0;z-index:20;
  }
  .prioItem.dragOver{border-color:#d9822b;background:#fff4d8}
  .prioRankBadge{
    min-width:34px;height:34px;border-radius:9px;background:#2c5e4e;
    color:#fff6dc;font-weight:900;font-size:13px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .prioDragHandle{
    cursor:grab;font-size:16px;color:#7a6240;padding:2px 4px;
    user-select:none;flex-shrink:0;
  }
  .prioDragHandle:active{cursor:grabbing}
  .prioText{flex:1;font-size:14px;font-weight:650;color:#2f423e;line-height:1.45}
  .prioMoveBtns{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
  .prioMiniBtn{padding:2px 8px;font-size:11px;line-height:1.2;border-radius:6px;background:#efe6cf}

  /* MÀN HÌNH CHUYỂN CẢNH DO HOST KIỂM SOÁT */
  #phaseOverlay{
    display:none;position:fixed;inset:0;z-index:90;
    background:rgba(15,25,28,0.92);color:#fff7e3;
    align-items:center;justify-content:center;padding:20px;overflow:hidden;
  }
  #phaseOverlay.show{display:flex}
  #phaseCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .ovBox{
    position:relative;z-index:2;max-width:680px;width:100%;
    background:rgba(25,44,45,0.92);border:2px solid #e5b55c;border-radius:18px;
    padding:24px;box-shadow:0 18px 40px rgba(0,0,0,0.5);
  }
  .ovBadge{
    display:inline-block;background:#e59a2d;color:#241504;font-weight:900;
    font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:8px;
  }
  .ovTitle{margin:0 0 8px;font-size:24px;font-weight:900;color:#ffe6a3}
  .ovDesc{margin:0 0 14px;line-height:1.6;color:#f3ead2}
  .ovTopics{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,230,163,0.3);
    border-radius:12px;padding:12px 14px;margin-bottom:16px;
  }
  .ovTopicsTitle{font-weight:800;margin-bottom:6px;color:#ffd875}
  .ovTopics ul{margin:0;padding-left:20px;line-height:1.55}
  .ovTopics.hidden{display:none}

  /* POPUP BIẾN CỐ "ÔNG TRỜI" */
  #eventPopup{
    display:none;position:fixed;inset:0;z-index:100;
    background:rgba(0,0,0,0.68);align-items:center;justify-content:center;padding:16px;
  }
  #eventPopup.show{display:flex}
  .epCard{
    max-width:520px;width:100%;background:#fffdf6;border:3px solid #c45b28;
    border-radius:16px;padding:20px;box-shadow:0 18px 36px rgba(0,0,0,0.45);
  }
  .epTitle{margin:0 0 8px;font-size:19px;font-weight:900;color:#9e2d10}
  .epBody{margin:0 0 14px;line-height:1.55;font-size:14.5px}

  /* TOAST */
  #toast{
    position:fixed;bottom:18px;right:18px;z-index:120;
    background:#1b3334;color:#fff7e0;border:2px solid #e5b55c;
    padding:10px 15px;border-radius:12px;font-weight:750;font-size:13.5px;
    box-shadow:0 8px 22px rgba(0,0,0,0.35);opacity:0;transform:translateY(10px);
    transition:all 0.22s ease;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brandTitle">🌊 RÁNG MỠ GÀ: CÓ NHÀ THÌ GIỮ</div>
      <div class="brandSub">Mô phỏng cộng đồng ứng phó thiên tai · Màn hình người chơi</div>
    </div>
    <div class="hudPill">
      <span class="chip" id="roomChip">Phòng: ---</span>
      <span class="chip" id="clock">CHỜ HOST</span>
      <button id="muteBtn" style="padding:4px 9px;font-size:12px" onclick="toggleSoundBtn()" title="Bật/Tắt âm thanh">🔊</button>
      <button style="padding:4px 9px;font-size:12px" onclick="resetLocalPlayer()">Đổi tên / Hộ</button>
    </div>
  </div>

  <div id="joinBox" class="panel">
    <h2 style="margin:0 0 6px">Tham gia khu phố ven sông</h2>
    <p class="small" style="margin:0 0 14px">Nhập tên gia đình / hộ của bạn để nhận thẻ vai và bước vào mô phỏng cùng Host.</p>
    <div class="row">
      <input id="nameInput" placeholder="Ví dụ: Hộ bác Ba, Nhà chị Lan..." style="flex:1;min-width:220px" />
      <button class="primary" onclick="joinGame()">Vào phòng chơi →</button>
    </div>
  </div>

  <div id="gameBox" class="panel" style="display:none"></div>
</div>

<!-- MÀN HÌNH CHUYỂN CẢNH DO HOST KIỂM SOÁT -->
<div id="phaseOverlay">
  <canvas id="phaseCanvas"></canvas>
  <div class="ovBox">
    <div class="ovBadge" id="ovBadge">CHUYỂN CẢNH</div>
    <h2 class="ovTitle" id="ovTitle"></h2>
    <p class="ovDesc" id="ovDesc"></p>
    <div class="ovTopics hidden" id="ovTopics"></div>
    <div class="row" style="justify-content:flex-end">
      <button class="primary" id="ovActionBtn" onclick="hidePhaseOverlay()">Tiếp tục →</button>
    </div>
  </div>
</div>

<!-- POPUP BIẾN CỐ "ÔNG TRỜI" -->
<div id="eventPopup">
  <div class="epCard">
    <div class="epTitle" id="epTitle">⚡ BIẾN CỐ TỪ "ÔNG TRỜI"</div>
    <p class="epBody" id="epBody"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="primary" onclick="closeEventPopup()">Đã rõ tình huống</button>
    </div>
  </div>
</div>

<div id="toast"></div>

// ================= HỆ THỐNG ÂM THANH HIỆU ỨNG (WEB AUDIO API) =================
const SoundFX = (() => {
  let ctx = null;
  let muted = false;
  let ambientNodes = [];
  let activeAmbientMode = null;

  function ensureCtx() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ctx = new AudioCtx();
    }
    if (ctx && ctx.state === 'suspended') {
      ctx.resume().catch(() => {});
    }
    return ctx;
  }

  window.addEventListener('pointerdown', () => { ensureCtx(); }, { passive: true });

  function stopAmbient() {
    ambientNodes.forEach(n => {
      try {
        if (typeof n.stop === 'function') n.stop();
        if (typeof n.disconnect === 'function') n.disconnect();
      } catch (_) {}
    });
    ambientNodes = [];
    activeAmbientMode = null;
  }

  function createNoiseBuffer(c, seconds = 2) {
    const len = Math.floor(c.sampleRate * seconds);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    return buf;
  }

  function startRainLoop(c, gainVal, filterFreq) {
    const src = c.createBufferSource();
    src.buffer = createNoiseBuffer(c, 2.5);
    src.loop = true;

    const filter = c.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = filterFreq;
    filter.Q.value = 0.7;

    const g = c.createGain();
    g.gain.setValueAtTime(0.001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(Math.max(0.001, gainVal), c.currentTime + 0.6);

    src.connect(filter);
    filter.connect(g);
    g.connect(c.destination);
    src.start();
    ambientNodes.push(src, filter, g);
    return g;
  }

  function startCrowdChatterLoop(c, gainVal) {
    const src = c.createBufferSource();
    src.buffer = createNoiseBuffer(c, 3);
    src.loop = true;

    const filter = c.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 520;
    filter.Q.value = 2.2;

    const lfo = c.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 2.6;
    const lfoGain = c.createGain();
    lfoGain.gain.value = gainVal * 0.45;

    const g = c.createGain();
    g.gain.setValueAtTime(gainVal * 0.65, c.currentTime);

    lfo.connect(lfoGain);
    lfoGain.connect(g.gain);
    src.connect(filter);
    filter.connect(g);
    g.connect(c.destination);

    src.start();
    lfo.start();
    ambientNodes.push(src, filter, lfo, lfoGain, g);
  }

  function startStormWindLoop(c, gainVal) {
    const src = c.createBufferSource();
    src.buffer = createNoiseBuffer(c, 3);
    src.loop = true;

    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 340;

    const lfo = c.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.35;
    const lfoGain = c.createGain();
    lfoGain.gain.value = 220;

    const g = c.createGain();
    g.gain.value = gainVal;

    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    src.connect(filter);
    filter.connect(g);
    g.connect(c.destination);

    src.start();
    lfo.start();
    ambientNodes.push(src, filter, lfo, lfoGain, g);
  }

  function playThunder(c) {
    const src = c.createBufferSource();
    src.buffer = createNoiseBuffer(c, 1.8);

    const filter = c.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(240, c.currentTime);
    filter.frequency.exponentialRampToValueAtTime(55, c.currentTime + 1.6);

    const g = c.createGain();
    g.gain.setValueAtTime(0.001, c.currentTime);
    g.gain.linearRampToValueAtTime(0.42, c.currentTime + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 1.7);

    src.connect(filter);
    filter.connect(g);
    g.connect(c.destination);
    src.start();
    src.stop(c.currentTime + 1.75);
  }

  function playSunnyChime(c) {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, idx) => {
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = 'triangle';
      const t0 = c.currentTime + idx * 0.14;
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(0.11, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.65);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + 0.7);
    });
  }

  function setAmbient(mode) {
    if (muted) { stopAmbient(); return; }
    const c = ensureCtx();
    if (!c) return;
    if (activeAmbientMode === mode) return;
    stopAmbient();
    activeAmbientMode = mode;

    if (mode === 'p1') {
      startRainLoop(c, 0.045, 1300);
    } else if (mode === 'p2') {
      startRainLoop(c, 0.09, 1150);
      startCrowdChatterLoop(c, 0.075);
    } else if (mode === 'break') {
      startRainLoop(c, 0.03, 1400);
    } else if (mode === 'p3') {
      startRainLoop(c, 0.16, 950);
      startStormWindLoop(c, 0.14);
      playThunder(c);
    } else if (mode === 'p4') {
      const rainG = startRainLoop(c, 0.04, 1500);
      if (rainG) {
        rainG.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 2.6);
      }
      setTimeout(() => {
        if (!muted && activeAmbientMode === 'p4') playSunnyChime(c);
      }, 900);
    }
  }

  function playNotiBell() {
    if (muted) return;
    const c = ensureCtx();
    if (!c) return;
    const freqs = [880, 1174.66];
    freqs.forEach((f, i) => {
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = 'sine';
      const t0 = c.currentTime + i * 0.12;
      osc.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(0.14, t0 + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + 0.45);
    });
  }

  function playEmergencyAlarm() {
    if (muted) return;
    const c = ensureCtx();
    if (!c) return;
    for (let k = 0; k < 2; k++) {
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = 'sawtooth';
      const t0 = c.currentTime + k * 0.48;
      osc.frequency.setValueAtTime(660, t0);
      osc.frequency.linearRampToValueAtTime(880, t0 + 0.18);
      osc.frequency.linearRampToValueAtTime(620, t0 + 0.38);
      g.gain.setValueAtTime(0.001, t0);
      g.gain.linearRampToValueAtTime(0.11, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
      osc.connect(g);
      g.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + 0.44);
    }
  }

  function playHelicopter() {
    if (muted) return;
    const c = ensureCtx();
    if (!c) return;
    const osc = c.createOscillator();
    const lfo = c.createOscillator();
    const lfoGain = c.createGain();
    const g = c.createGain();

    osc.type = 'sawtooth';
    osc.frequency.value = 95;
    lfo.type = 'sine';
    lfo.frequency.value = 11;
    lfoGain.gain.value = 0.08;

    g.gain.setValueAtTime(0.09, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 2.2);

    lfo.connect(lfoGain);
    lfoGain.connect(g.gain);
    osc.connect(g);
    g.connect(c.destination);

    osc.start();
    lfo.start();
    osc.stop(c.currentTime + 2.2);
    lfo.stop(c.currentTime + 2.2);
  }

  function playCableCut() {
    if (muted) return;
    const c = ensureCtx();
    if (!c) return;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(420, c.currentTime);
    osc.frequency.exponentialRampToValueAtTime(75, c.currentTime + 0.45);
    g.gain.setValueAtTime(0.11, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.48);
    osc.connect(g);
    g.connect(c.destination);
    osc.start();
    osc.stop(c.currentTime + 0.5);
  }

  function playFloodCrisis() {
    if (muted) return;
    const c = ensureCtx();
    if (!c) return;
    startStormWindLoop(c, 0.22);
    playThunder(c);
    playEmergencyAlarm();
  }

  function playForGodEvent(rawText) {
    if (rawText.includes('cứu trợ') || rawText.includes('Cứu trợ') || rawText.includes('cứu hộ')) {
      playHelicopter();
    } else if (rawText.includes('đứt đường truyền') || rawText.includes('mất điện') || rawText.includes('đứt cáp')) {
      playCableCut();
    } else if (rawText.includes('lũ cuốn') || rawText.includes('ngập') || rawText.includes('dâng nhanh')) {
      playFloodCrisis();
    } else {
      playEmergencyAlarm();
    }
  }

  function toggleMute() {
    muted = !muted;
    if (muted) {
      stopAmbient();
    } else {
      const tid = TASKS[room?.taskIdx]?.id || '';
      const mood = PHASE_SCENES[tid]?.mood;
      if (mood) setAmbient(mood);
      playNotiBell();
    }
    return muted;
  }

  return {
    setAmbient, playNotiBell, playEmergencyAlarm,
    playForGodEvent, toggleMute
  };
})();

let phaseAnimActive = false;
let currentPhaseMood = null;
let particles = [];

function hidePhaseOverlay() {
  $('phaseOverlay').classList.remove('show');
  phaseAnimActive = false;
}

function triggerPhaseScene(taskId) {
  const sc = PHASE_SCENES[taskId];
  if (!sc) return;

  const ov = $('phaseOverlay');
  ov.className = 'show ' + (sc.theme || '');
  $('ovBadge').textContent = sc.badge;
  $('ovTitle').textContent = sc.title;
  $('ovDesc').textContent = sc.desc;

  const topicsEl = $('ovTopics');
  if (sc.topics && sc.topics.length) {
    topicsEl.innerHTML = `<div class="ovTopicsTitle">💬 Các mục thảo luận</div><ul>${sc.topics.map(item => `<li>${esc(item)}</li>`).join('')}</ul>`;
    topicsEl.classList.remove('hidden');
  } else {
    topicsEl.innerHTML = '';
    topicsEl.classList.add('hidden');
  }

  $('ovActionBtn').textContent = sc.btnText || 'Tiếp tục →';
  currentPhaseMood = sc.mood;
  particles = [];

  if (sc.mood) SoundFX.setAmbient(sc.mood);
  if (!phaseAnimActive) {
    phaseAnimActive = true;
    requestAnimationFrame(runPhaseCanvasLoop);
  }
  if (sc.shake) {
    document.body.classList.add('shaking');
    setTimeout(() => document.body.classList.remove('shaking'), 1200);
  }
}

function runPhaseCanvasLoop() {
  if (!phaseAnimActive) return;
  const canvas = $('phaseCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const targetCount = currentPhaseMood === 'p3' ? 95 : (currentPhaseMood === 'p2' ? 55 : (currentPhaseMood === 'p4' ? 12 : 35));
  while (particles.length < targetCount) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: currentPhaseMood === 'p3' ? 18 : 11,
      spd: currentPhaseMood === 'p3' ? 11 + Math.random() * 6 : 4 + Math.random() * 3
    });
  }

  if (currentPhaseMood !== 'p4') {
    ctx.strokeStyle = currentPhaseMood === 'p3' ? 'rgba(205,235,255,0.45)' : 'rgba(255,240,205,0.28)';
    ctx.lineWidth = 1.4;
    particles.forEach(p => {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - (currentPhaseMood === 'p3' ? 2.5 : 0.8), p.y + p.len);
      ctx.stroke();
      p.y += p.spd;
      p.x -= currentPhaseMood === 'p3' ? 1.8 : 0.4;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
    });
  } else {
    const grad = ctx.createRadialGradient(canvas.width * 0.8, canvas.height * 0.2, 20, canvas.width * 0.8, canvas.height * 0.2, 240);
    grad.addColorStop(0, 'rgba(255, 224, 120, 0.25)');
    grad.addColorStop(1, 'rgba(255, 224, 120, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  requestAnimationFrame(runPhaseCanvasLoop);
}

async function joinGame() {

  if (!name) return toast('Vui lòng nhập tên hộ / gia đình!');
  if (!myId) {
    myId = 'p_' + Math.random().toString(36).slice(2, 9);
    localStorage.setItem('rmg_player_id', myId);
  }
  const idx = Math.abs(myId.split('').reduce((a, c) => a + c.charCodeAt(0), 0)) % PROFILES.length;
  const profile = PROFILES[idx];

  await DB.ref(`room/players/${myId}`).update({
    name,
    profile,
    bag: [],
    votedNews: null,
    readNoticeAfterVote: false,
    prepared: null,
    priorityOrder: Array.from({ length: CHECKLIST.length }, (_, i) => i),
    joinedAt: Date.now()
  });
  toast(`Chào ${name}! Đã vào phòng.`);
}

function resetLocalPlayer() {
  localStorage.removeItem('rmg_player_id');
  myId = '';
  noticeReadLocal = false;
  prioOrder = null;
  prioSaved = false;
  $('gameBox').style.display = 'none';
  $('joinBox').style.display = 'block';
  toast('Đã đặt lại thông tin người chơi.');
}

async function toggleBagItem(itemId, currentBag) {
  const set = new Set(Array.isArray(currentBag) ? currentBag : []);
  const item = BAG_ITEMS.find(x => x.id === itemId);
  if (!item) return;

  if (set.has(itemId)) {
    set.delete(itemId);
  } else {
    const used = [...set].reduce((sum, id) => {
      const f = BAG_ITEMS.find(x => x.id === id);
      return sum + (f ? f.weight : 0);
    }, 0);
    if (used + item.weight > BAG_MAX_WEIGHT) {
      return toast(`Vượt sức chứa ba lô (${BAG_MAX_WEIGHT}kg)! Hãy bỏ bớt đồ khác.`);
    }
    set.add(itemId);
  }
  await DB.ref(`room/players/${myId}/bag`).set([...set]);
}

  await DB.ref(`room/players/${myId}/votedNews`).set(newsId);

// ================= KÉO THẢ SẮP XẾP THỨ TỰ ƯU TIÊN CHECKLIST =================
function ensurePrioOrder(me) {
  const total = CHECKLIST.length;
  const base = Array.isArray(me?.priorityOrder) && me.priorityOrder.length === total
    ? [...me.priorityOrder]
    : Array.from({ length: total }, (_, i) => i);
  if (!prioOrder || prioOrder.length !== total) {
    prioOrder = base;
  }
  return prioOrder;
}

function movePrioIndex(fromIdx, toIdx) {
  const total = CHECKLIST.length;
  if (fromIdx === toIdx || fromIdx < 0 || toIdx < 0 || fromIdx >= total || toIdx >= total) return;
  const next = [...prioOrder];
  const [moved] = next.splice(fromIdx, 1);
  next.splice(toIdx, 0, moved);
  prioOrder = next;
  prioSaved = false;
  renderGame();
}

async function savePriorityOrder() {
  if (!myId || !prioOrder) return;
  await DB.ref(`room/players/${myId}/priorityOrder`).set(prioOrder);
  prioSaved = true;
  toast('✓ Đã lưu thứ tự ưu tiên chuẩn bị của gia đình!');
  renderGame();
}

let dragSrcIndex = null;
let dragCurrentOverIndex = null;

function onPrioPointerDown(e, idx) {
  if (e.target.closest('.prioMoveBtns')) return;
  if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;

  dragSrcIndex = idx;
  dragCurrentOverIndex = idx;

  const listEl = document.getElementById('prioListBox');
  if (!listEl) return;
  const rowEls = [...listEl.querySelectorAll('.prioItem')];
  const activeRow = rowEls[idx];
  if (activeRow) activeRow.classList.add('dragging');

  function handleMove(ev) {
    const clientY = ev.clientY;
    let targetIdx = dragSrcIndex;
    rowEls.forEach((el, rIdx) => {
      el.classList.remove('dragOver');
      const rect = el.getBoundingClientRect();
      if (clientY >= rect.top && clientY <= rect.bottom) {
        targetIdx = rIdx;
      }
    });
    dragCurrentOverIndex = targetIdx;
    if (targetIdx !== null && targetIdx !== dragSrcIndex && rowEls[targetIdx]) {
      rowEls[targetIdx].classList.add('dragOver');
    }
  }

  function handleUp() {
    window.removeEventListener('pointermove', handleMove);
    window.removeEventListener('pointerup', handleUp);
    rowEls.forEach(el => el.classList.remove('dragging', 'dragOver'));

    if (dragSrcIndex !== null && dragCurrentOverIndex !== null && dragSrcIndex !== dragCurrentOverIndex) {
      movePrioIndex(dragSrcIndex, dragCurrentOverIndex);
    }
    dragSrcIndex = null;
    dragCurrentOverIndex = null;
  }

  window.addEventListener('pointermove', handleMove);
  window.addEventListener('pointerup', handleUp);
}

// ================= RENDER GIAO DIỆN NGƯỜI CHƠI =================
function renderNewsList(newsArr, allowVote, myVote) {
  const list = Array.isArray(newsArr) && newsArr.length ? newsArr : DEFAULT_NEWS;
  return list.map(n => {
    const trustMap = {
      high: ['Nguồn chính thống', 'trust-high'],
      mid: ['Thông tin cộng đồng', 'trust-mid'],
      low: ['Tin đồn chưa kiểm chứng', 'trust-low']
    };
    const [tLabel, tCls] = trustMap[n.trust] || trustMap.mid;
    const isVoted = myVote === n.id;
    return `<div class="newsCard">
      <div class="newsHeader">
        <b>📰 ${esc(n.source)}</b>
        <span class="trustBadge ${tCls}">${esc(tLabel)}</span>
      </div>
      <div style="line-height:1.5">${esc(n.text)}</div>
      ${allowVote ? `<div style="margin-top:8px">
        <button class="${isVoted ? 'primary' : ''}" onclick="voteNews('${esc(n.id)}')">
          ${isVoted ? '✓ Đã bình chọn tin này' : 'Bình chọn tin này'}
        </button>
      </div>` : ''}
    </div>`;
  }).join('');
}

function renderGame() {
  const players = room?.players || {};
  const me = myId ? players[myId] : null;

  if (!myId || !me) {
    $('joinBox').style.display = 'block';
    $('gameBox').style.display = 'none';
    return;
  }
  $('joinBox').style.display = 'none';
  $('gameBox').style.display = 'block';
  $('roomChip').textContent = `Hộ: ${me.name}`;

  // Xử lý biến cố "Ông Trời" mới
  const evAt = room?.lastEvent?.at || 0;
  if (evAt && evAt !== lastEventAt) {
    lastEventAt = evAt;
    showEventPopup(room.lastEvent.text || 'Có biến cố mới từ "Ông Trời"!');
  }

  // Xử lý tín hiệu hiện màn chuyển cảnh từ Host
  const sigAt = room?.sceneSignal?.at || 0;
  if (sigAt && sigAt !== lastSceneSignalAt) {
    lastSceneSignalAt = sigAt;
    if (room.sceneSignal.taskId) triggerPhaseScene(room.sceneSignal.taskId);
  }

  if (!room?.locked || room.taskIdx < 0 || room.taskIdx >= TASKS.length) {
    $('gameBox').innerHTML = `<div class="card">
      <h3>⏳ Đang chờ Host bắt đầu phiên chơi...</h3>
      <p class="small">Hộ của bạn: <b>${esc(me.name)}</b> · Vai trò: <b>${esc(me.profile?.title || '')}</b></p>
      <p class="small">${esc(me.profile?.membersText || '')}</p>
    </div>`;
    return;
  }

  const t = TASKS[room.taskIdx];
  if (t.id !== lastTaskId) {
    lastTaskId = t.id;
    noticeReadLocal = Boolean(me.readNoticeAfterVote);
    prioOrder = null;
    prioSaved = false;

    if (PHASE_SCENES[t.id]) {
      triggerPhaseScene(t.id);
    } else if (t.id === 'news_after_vote') {
      SoundFX.playNotiBell();
    } else if (t.id === 'alert') {
      SoundFX.playEmergencyAlarm();
    }
  }

  let bodyHtml = '';

  if (t.id === 'profile_card') {
    bodyHtml = `<div class="card">
      <span class="pill">THẺ VAI GIA ĐÌNH</span>
      <h3 style="margin:8px 0 6px">${esc(me.profile?.title || '')}</h3>
      <p style="margin:0 0 8px;line-height:1.5"><b>Hoàn cảnh:</b> ${esc(me.profile?.membersText || '')}</p>
      <p class="small" style="margin:0"><b>Gợi ý bối cảnh:</b> ${esc(me.profile?.hint || '')}</p>
    </div>`;

  } else if (t.id === 'bag_90s') {
    const selected = Array.isArray(me.bag) ? me.bag : [];
    const usedWeight = selected.reduce((sum, id) => {
      const f = BAG_ITEMS.find(x => x.id === id);
      return sum + (f ? f.weight : 0);
    }, 0);

    bodyHtml = stageCountdownHtml('Thời gian chọn đồ vào ba lô (90s)') +
    `<div class="card">
      <div class="row" style="justify-content:space-between">
        <b>🎒 Sức chứa ba lô: ${usedWeight} / ${BAG_MAX_WEIGHT} kg</b>
        <span class="small">Đã chọn ${selected.length} món</span>
      </div>
      <div class="bagGrid">` +
      BAG_ITEMS.map(item => {
        const active = selected.includes(item.id);
        return `<button type="button" class="bagItem ${active ? 'selected' : ''}" onclick="toggleBagItem('${item.id}', ${JSON.stringify(selected).replace(/"/g, '&quot;')})">
          <div class="bagItemHead">
            <span>${active ? '✓ ' : ''}${esc(item.name)}</span>
            <span class="pill">${item.weight}kg</span>
          </div>
          <span class="small">${esc(item.tag)}</span>
        </button>`;
      }).join('') +
      `</div>
    </div>`;

  } else if (t.id === 'news') {
    bodyHtml = `<div class="card">
      <span class="pill">BẢNG TIN CỘNG ĐỒNG · T–48H</span>
      <h3 style="margin:8px 0 6px">Thông tin đang lan truyền trong khu phố</h3>
      <p class="small" style="margin:0 0 10px">Đọc kỹ các nguồn tin trước khi bước vào bình chọn.</p>
      ${renderNewsList(room.news, false, me.votedNews)}
    </div>`;

  } else if (t.id === 'vote_news') {
    bodyHtml = stageCountdownHtml('Thời gian bình chọn bảng tin') +
    `<div class="card">
      <span class="pill">BÌNH CHỌN BẢNG TIN</span>
      <h3 style="margin:8px 0 6px">Chọn thông tin bạn cho là đáng tin cậy nhất</h3>
      ${renderNewsList(room.news, true, me.votedNews)}
    </div>`;

  } else if (t.id === 'news_after_vote') {
    const isRead = Boolean(me.readNoticeAfterVote || noticeReadLocal);
    bodyHtml = `<div class="card" style="background:#fffdf5;border:2px solid #cfa96e">
      <div class="newsHeader">
        <span class="pill">📢 BẢNG TIN THÔNG BÁO CỘNG ĐỒNG</span>
        <span class="small" style="font-weight:800">${isRead ? '✅ Đã xác nhận đã đọc' : '⏳ Chưa xác nhận'}</span>
      </div>
      <p style="margin:6px 0 10px;line-height:1.5">Sau khi khu phố bình chọn thông tin, dưới đây là bảng tin thông báo để các hộ nắm tình hình trước khi đưa ra quyết định tiếp theo:</p>
      ${renderNewsList(room.news, false, me.votedNews)}
      <div class="hr"></div>
      <button class="primary" style="width:100%;padding:12px" onclick="markNoticeAfterVoteRead()">
        ${isRead ? '✅ ĐÃ ĐỌC BẢNG TIN (Đã ghi nhận)' : '✅ ĐÃ ĐỌC BẢNG TIN'}
      </button>
    </div>`;

  } else if (t.id === 'board_decide') {
    const chosenText = me.prepared === true
      ? 'Chủ động chuẩn bị ứng phó trước và sẵn sàng sơ tán'
      : (me.prepared === false ? 'Bình tĩnh chờ đợi thêm những thông tin chính xác hơn' : null);

    bodyHtml = stageCountdownHtml('Thời gian lựa chọn phương án ứng phó') +
    `<div class="card">
      <h3 style="margin:0 0 6px">🧭 Lựa chọn phương án của hộ ${esc(me.name)}</h3>
      <p class="small" style="margin:0 0 12px">Dựa trên bảng tin cộng đồng và hoàn cảnh gia đình, hộ của bạn chọn phương án nào?</p>
      <div class="row" style="flex-direction:column;gap:10px">
        <button class="primary" style="width:100%;text-align:left;padding:12px 14px" onclick="decide(true)">
          Chủ động chuẩn bị ứng phó trước và sẵn sàng sơ tán
        </button>
        <button class="warn" style="width:100%;text-align:left;padding:12px 14px" onclick="decide(false)">
          Bình tĩnh chờ đợi thêm những thông tin chính xác hơn
        </button>
      </div>
      ${chosenText
        ? `<div class="hr"></div><div class="ok">✓ Đã ghi nhận lựa chọn: <b>${esc(chosenText)}</b></div>`
        : `<div class="hr"></div><div class="small">Hãy chọn một trong hai phương án trên.</div>`}
    </div>`;

  } else if (t.id === 'checklist') {
    if (me.prepared === true) {
      const order = ensurePrioOrder(me);
      const roleSubtitle = cleanRoleSubtitle(me.profile?.title);
      bodyHtml = stageCountdownHtml('Thời gian sắp xếp thứ tự ưu tiên chuẩn bị') +
      `<div class="prioHintCard">
        <b>🎭 Hoàn cảnh của ${esc(me.name)} (${esc(roleSubtitle)}):</b> ${esc(me.profile?.membersText || '')}<br>
        <span class="small" style="color:#4a5e59">Kéo thả các mục hoặc bấm ▲/▼ để xếp từ <b>#1 (ưu tiên nhất)</b> đến <b>#${order.length}</b> theo phán đoán & trải nghiệm của gia đình bạn. Không có đáp án đúng/sai.</span>
      </div>
      <div id="prioListBox" class="prioList">` +
      order.map((itemIdx, pos) => `
        <div class="prioItem" onpointerdown="onPrioPointerDown(event, ${pos})">
          <div class="prioRankBadge">#${pos + 1}</div>
          <span class="prioDragHandle" title="Kéo để đổi vị trí">☰</span>
          <div class="prioText">${esc(CHECKLIST[itemIdx] || '')}</div>
          <div class="prioMoveBtns">
            <button type="button" class="prioMiniBtn" ${pos === 0 ? 'disabled' : ''} onclick="movePrioIndex(${pos}, ${pos - 1})" title="Đưa lên">▲</button>
            <button type="button" class="prioMiniBtn" ${pos === order.length - 1 ? 'disabled' : ''} onclick="movePrioIndex(${pos}, ${pos + 1})" title="Đưa xuống">▼</button>
          </div>
        </div>
      `).join('') +
      `</div>
      <button class="primary" style="width:100%;padding:12px" onclick="savePriorityOrder()">
        ${(Array.isArray(me.priorityOrder) && me.priorityOrder.length === CHECKLIST.length && prioSaved)
          ? '✅ ĐÃ LƯU THỨ TỰ ƯU TIÊN (Bấm để cập nhật lại)'
          : '📌 CHỐT THỨ TỰ ƯU TIÊN CHUẨN BỊ'}
      </button>`;
    } else {
      bodyHtml = stageCountdownHtml('Thời gian giai đoạn chuẩn bị trước bão') +
      `<div class="card">⏳ <b>${esc(me.name)}</b> đã chọn <i>"Bình tĩnh chờ đợi thêm những thông tin chính xác hơn"</i>.</div>`;
    }

  } else if (t.id === 'break') {
    bodyHtml = `<div class="card">
      <span class="pill">SHARING SESSION</span>
      <h3 style="margin:8px 0 6px">Lắng nghe & chia sẻ giữa các hộ</h3>
      <p style="line-height:1.55">Cùng trao đổi với Host và các gia đình quanh phố về cách bạn đánh giá thông tin và chuẩn bị trước khi bão đổ bộ.</p>
    </div>`;

  } else if (t.id === 'alert') {
    bodyHtml = stageCountdownHtml('Thời gian báo động bão lũ đổ bộ') +
    `<div class="card">
      <span class="pill">T–0H · BÁO ĐỘNG KHẨN CẤP</span>
      <h3 style="margin:8px 0 6px">Bão lũ đang đổ bộ vào khu phố!</h3>
      <p style="line-height:1.55">Theo dõi các biến cố từ "Ông Trời" và phối hợp ứng phó cùng cộng đồng.</p>
    </div>`;

  } else if (t.id === 'respond') {
    bodyHtml = stageCountdownHtml('Thời gian phản ứng & ứng cứu trong bão lũ') +
    `<div class="card">
      <span class="pill">ỨNG CỨU TRONG BÃO LŨ</span>
      <h3 style="margin:8px 0 6px">Hành động của hộ ${esc(me.name)}</h3>
      <p style="line-height:1.55">Khi có biến cố bất ngờ (ngập nhanh, mất điện/đứt truyền thông, chia cắt, cứu trợ), hãy phối hợp giữ an toàn cho các thành viên trong gia đình.</p>
    </div>`;

  } else if (t.id === 'ending') {
    const chosenSummary = me.prepared === true
      ? 'Chủ động chuẩn bị ứng phó trước và sẵn sàng sơ tán'
      : (me.prepared === false ? 'Bình tĩnh chờ đợi thêm những thông tin chính xác hơn' : 'Chưa ghi nhận');
    bodyHtml = `<div class="card">
      <span class="pill">NGÀY MAI · TRỜI QUANG MÂY TẠNH</span>
      <h3 style="margin:8px 0 6px">Tổng kết hành trình của hộ ${esc(me.name)}</h3>
      <p style="line-height:1.55"><b>Thẻ vai:</b> ${esc(me.profile?.title || '')}</p>
      <p style="line-height:1.55"><b>Số món trong ba lô:</b> ${(me.bag || []).length} món</p>
      <p style="line-height:1.55"><b>Quyết định trước bão:</b> ${esc(chosenSummary)}</p>
    </div>`;
  }

  $('gameBox').innerHTML = `
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <span class="pill">PHẦN ${t.phase} · ${esc(t.label)}</span>
      <span class="small">Hộ: <b>${esc(me.name)}</b></span>
    </div>
    ${bodyHtml}
  `;
}

// ================= ĐỒNG BỘ REALTIME & ĐỒNG HỒ =================
DB.ref('room').on('value', (snap) => {
  room = snap.val() || {};
  renderGame();
});

setInterval(() => {
  if (!room || !room.locked || room.taskIdx < 0 || room.taskIdx >= TASKS.length) {
    $('clock').textContent = room?.locked ? 'ĐÃ KẾT THÚC' : 'CHỜ HOST';
  } else {
    const t = TASKS[room.taskIdx];
    $('clock').textContent = `P${t.phase} · ${getCountdownText()}`;
  }
  const cdText = getCountdownText();
  document.querySelectorAll('[data-stage-countdown="1"]').forEach(el => {
    el.textContent = cdText;
  });
}, 500);
</script>
