<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ráng Mỡ Gà: Có Nhà Thì Giữ — Host Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#122425;
    --panel:#fffdf6;
    --ink:#243532;
    --muted:#5c706b;
    --border:#cbb792;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  .wrap{max-width:1160px;margin:0 auto;padding:16px}
  .topbar{
    display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;
    background:#1d3b3c;color:#fff7e0;padding:14px 18px;border-radius:14px;
    border:2px solid #8c6d43;margin-bottom:14px;
  }
  .chip{
    background:#101f20;color:#ffe6a3;border:1px solid #8c6d43;
    padding:5px 11px;border-radius:999px;font-size:13px;font-weight:750;
  }
  .panel{
    background:var(--panel);border:2px solid var(--border);border-radius:16px;
    padding:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
  .card{
    background:#faf4e4;border:1.5px solid #d4bf99;border-radius:12px;
    padding:12px;margin-bottom:10px;
  }
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .small{font-size:12.5px;color:var(--muted)}
  .pill{
    display:inline-block;background:#f7dfb0;color:#4a2f0b;border:1px solid #d4a657;
    padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:800;
  }
  button{
    font-family:inherit;font-size:13px;font-weight:800;padding:8px 12px;
    border-radius:10px;border:1.5px solid #b39b70;background:#f3e7c9;color:var(--ink);
    cursor:pointer;
  }
  button:hover:not(:disabled){filter:brightness(1.04)}
  button:disabled{opacity:0.45;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#f9cf66,#e19424);border-color:#9e6110;color:#2b1a05}
  button.warn{background:linear-gradient(180deg,#f59e6c,#cf5a25);border-color:#8a350e;color:#fff}
  button.danger{background:#b93829;border-color:#7c1e14;color:#fff}
  select,input{
    font-family:inherit;font-size:13px;padding:8px 10px;border-radius:10px;
    border:1.5px solid #b39b70;background:#fff;color:var(--ink);
  }
  .pRow{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 10px;border:1px solid #d6c39e;border-radius:10px;background:#fffdf6;
    margin-bottom:7px;cursor:pointer;
  }
  .pRow.active{border-color:#2e7d5b;background:#e6f6ee}
  .logBox{
    max-height:220px;overflow-y:auto;background:#192c2d;color:#f3ead2;
    border-radius:10px;padding:10px;font-size:12.5px;line-height:1.55;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div style="font-weight:900;font-size:18px">🎛️ HOST DASHBOARD — RÁNG MỠ GÀ</div>
      <div class="small" style="color:#f5d58b">Kiểm soát chuyển cảnh thủ công · Điều phối biến cố "Ông Trời"</div>
    </div>
    <div class="row">
      <span class="chip" id="stageChip">Chưa bắt đầu</span>
      <span class="chip" id="clock">00:00</span>
      <span class="chip" id="doneChip">0 / 0 hộ</span>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button class="primary" onclick="startRoom()">▶ Bắt đầu / Reset phòng</button>
        <button onclick="prevTask()">← Cảnh trước</button>
        <button class="primary" onclick="nextTask(false)">Cảnh tiếp theo →</button>
        <button class="warn" onclick="replayCurrentScene()">🎬 Hiện màn chuyển cảnh</button>
        <button onclick="togglePause()" id="pauseBtn">⏸ Tạm dừng</button>
      </div>
      <div class="row">
        <select id="jumpSelect" onchange="jumpToTask(this.value)"></select>
        <button class="danger" onclick="endRoom()">⏹ Kết thúc</button>
      </div>
    </div>
    <div class="small" id="statusBar" style="margin-top:10px">Sẵn sàng điều phối.</div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h3 style="margin:0 0 8px">⚡ Giáng biến cố từ "Ông Trời"</h3>
      <div class="row" style="margin-bottom:10px">
        <select id="godSelect" style="flex:1;min-width:240px"></select>
        <button class="warn" onclick="triggerGodEvent()">Giáng biến cố</button>
      </div>
      <div class="small" style="margin-bottom:6px">Nhật ký sự kiện:</div>
      <div class="logBox" id="logBox"></div>
    </div>

    <div class="panel">
      <h3 style="margin:0 0 8px">🏠 Danh sách hộ tham gia & Chi tiết</h3>
      <div id="playerList"></div>
      <div id="inspector" class="card" style="margin-top:10px">Chọn một hộ ở trên để xem chi tiết.</div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const DB = firebase.database();

const TASKS = [
  { id:'profile_card', phase:1, label:'T–72h · Xem thẻ vai & bối cảnh gia đình', dur:90000 },
  { id:'bag_90s', phase:1, label:'T–72h · Chọn đồ vào ba lô khẩn cấp (90s)', dur:90000 },
  { id:'news', phase:2, label:'T–48h · Bảng tin cộng đồng & tin đồn lan truyền', dur:90000 },
  { id:'vote_news', phase:2, label:'T–48h · Bình chọn tin tức đáng tin cậy', dur:90000 },
  { id:'news_after_vote', phase:2, label:'T–48h · Bảng tin thông báo sau bình chọn (Xác nhận đã đọc)', dur:90000 },
  { id:'board_decide', phase:2, label:'T–48h · Quyết định phương án ứng phó', dur:90000 },
  { id:'checklist', phase:2, label:'T–48h · Sắp xếp thứ tự ưu tiên chuẩn bị', dur:120000 },
  { id:'break', phase:2, label:'Nghỉ giữa hiệp · Sharing Session', dur:300000 },
  { id:'alert', phase:3, label:'T–0h · Bão lũ đổ bộ & báo động khẩn cấp', dur:90000 },
  { id:'respond', phase:3, label:'T–0h · Phản ứng & ứng cứu trong bão lũ', dur:180000 },
  { id:'ending', phase:4, label:'Ngày mai · Trời quang mây tạnh & tổng kết', dur:180000 }
];

const BAG_ITEMS = [
  { id:'water', name:'Nước uống đóng chai (3 ngày)', weight:3 },
  { id:'food', name:'Lương khô / bánh mì / đồ hộp', weight:2 },
  { id:'med', name:'Túi thuốc cá nhân & thuốc đặc trị', weight:1 },
  { id:'docs', name:'Giấy tờ tùy thân, sổ đỏ, tiền mặt', weight:1 },
  { id:'torch', name:'Đèn pin & pin dự phòng / sạc dự phòng', weight:1 },
  { id:'raincoat', name:'Áo mưa bộ & áo phao cứu sinh', weight:2 },
  { id:'blanket', name:'Chăn mỏng / đồ giữ ấm', weight:2 },
  { id:'tv_box', name:'Đầu thu / loa giải trí cồng kềnh', weight:4 }
];

const DEFAULT_NEWS = [
  { id:'n1', source:'Đài Khí tượng & Ban Chỉ huy PCTT địa phương', trust:'high', text:'Áp thấp nhiệt đới mạnh lên thành bão, dự báo mưa to đến rất to trong 48–72 giờ tới; mực nước thượng nguồn có thể dâng cao.' },
  { id:'n2', source:'Nhóm Zalo xóm dưới', trust:'mid', text:'Nghe nói chiều nay xã sẽ xả lũ sớm khiến nước ngập tới đầu gối khu chợ cũ, mọi người bảo nhau dọn đồ lên cao.' },
  { id:'n3', source:'Tin đồn truyền miệng đầu ngõ', trust:'low', text:'Có tin đồn vỡ đê cách đây 15km và tối nay cắt điện toàn huyện vô thời hạn nên nhiều người đang đổ xô rút tiền và mua vét.' }
];

const CHECKLIST = [
  'Kê cao đồ đạc, thiết bị điện và nguồn lương thực, nước sạch lên vị trí an toàn',
  'Sắp xếp ba lô khẩn cấp gồm giấy tờ, thuốc men, đèn pin, sạc dự phòng và áo phao',
  'Kiểm tra tình trạng sức khỏe, chuẩn bị phương án hỗ trợ người già và trẻ nhỏ',
  'Theo dõi bản tin cảnh báo chính thống và giữ liên lạc với tổ dân phố / hàng xóm',
  'Ngắt cầu dao điện ở khu vực dễ ngập nước khi nước bắt đầu dâng sát nền nhà',
  'Thống nhất điểm hẹn và lộ trình sơ tán an toàn khi có lệnh di dời'
];

const GOD_EVENTS = [
  '🚨 Biến cố: Mưa lớn kéo dài khiến nước sông dâng nhanh bất ngờ, nhiều ngõ thấp bắt đầu ngập sâu!',
  '⚡ Biến cố: Sự cố đứt đường truyền thông tin & mất điện cục bộ ở một số khu vực ven sông!',
  '🌊 Biến cố: Lũ cuốn / dòng nước chảy xiết chia cắt lối đi tạm thời giữa các cụm dân cư!',
  '🚁 Biến cố: Lực lượng cứu trợ & xuồng tiếp tế đang tiếp cận các điểm cao — hãy phối hợp giữ trật tự và ưu tiên nhóm dễ bị tổn thương!'
];

let room = null;
let selectedPlayerId = null;
let logs = [];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));

function say(msg) {
  $('statusBar').textContent = msg;
}

function logEvent(msg) {
  const time = new Date().toLocaleTimeString('vi-VN', { hour12:false });
  logs.unshift(`[${time}] ${msg}`);
  $('logBox').innerHTML = logs.map(x => `<div>${esc(x)}</div>`).join('');
}

function initSelects() {
  $('jumpSelect').innerHTML = `<option value="">-- Nhảy tới cảnh --</option>` +
    TASKS.map((t, i) => `<option value="${i}">${i + 1}. ${esc(t.label)}</option>`).join('');
  $('godSelect').innerHTML = GOD_EVENTS.map((ev, i) => `<option value="${i}">${esc(ev)}</option>`).join('');
}

async function startRoom() {
  const t0 = TASKS[0];
  await DB.ref('room').update({
    locked: true,
    paused: false,
    taskIdx: 0,
    deadline: Date.now() + t0.dur,
    remaining: t0.dur,
    news: DEFAULT_NEWS,
    sceneSignal: { taskId: t0.id, at: Date.now() }
  });
  logEvent(`Bắt đầu phiên chơi tại: ${t0.label}`);
  say('Đã mở phòng & phát màn hình chuyển cảnh đầu tiên.');
}

async function setTaskIndex(idx) {
  if (idx < 0 || idx >= TASKS.length) return;
  const t = TASKS[idx];
  await DB.ref('room').update({
    locked: true,
    paused: false,
    taskIdx: idx,
    deadline: Date.now() + t.dur,
    remaining: t.dur,
    sceneSignal: { taskId: t.id, at: Date.now() }
  });
  logEvent(`Chuyển sang cảnh ${idx + 1}/${TASKS.length}: ${t.label}`);
  say(`Đang ở: ${t.label}`);
}

function prevTask() {
  const cur = room?.taskIdx ?? 0;
  if (cur <= 0) return say('Đang ở cảnh đầu tiên.');
  setTaskIndex(cur - 1);
}

function nextTask() {
  const cur = room?.taskIdx ?? -1;
  if (cur + 1 >= TASKS.length) return endRoom();
  setTaskIndex(cur + 1);
}

function jumpToTask(val) {
  if (val === '') return;
  setTaskIndex(Number(val));
  $('jumpSelect').value = '';
}

async function replayCurrentScene() {
  const cur = TASKS[room?.taskIdx];
  if (!cur) return say('Chưa có cảnh nào đang chạy.');
  await DB.ref('room/sceneSignal').set({ taskId: cur.id, at: Date.now() });
  logEvent(`🎬 Host phát lại màn chuyển cảnh: ${cur.label}`);
  say(`Đã gửi tín hiệu hiện màn chuyển cảnh: ${cur.label}`);
}

async function togglePause() {
  if (!room?.locked) return;
  if (!room.paused) {
    const rem = Math.max(0, (room.deadline || 0) - Date.now());
    await DB.ref('room').update({ paused: true, remaining: rem });
    logEvent('⏸ Host tạm dừng đồng hồ.');
  } else {
    const rem = room.remaining || TASKS[room.taskIdx]?.dur || 60000;
    await DB.ref('room').update({ paused: false, deadline: Date.now() + rem });
    logEvent('▶ Host tiếp tục đồng hồ.');
  }
}

async function endRoom() {
  await DB.ref('room').update({ locked: false, paused: false });
  logEvent('⏹ Host đã kết thúc phòng chơi.');
  say('Phiên chơi đã kết thúc.');
}

async function triggerGodEvent() {
  const idx = Number($('godSelect').value || 0);
  const text = GOD_EVENTS[idx] || GOD_EVENTS[0];
  await DB.ref('room/lastEvent').set({ text, at: Date.now() });
  logEvent(text);
  say('Đã gửi biến cố tới tất cả người chơi.');
}

function renderHost() {
  const playersObj = room?.players || {};
  const list = Object.entries(playersObj).map(([id, p]) => ({ id, ...p }));
  const curTask = (room?.locked && room.taskIdx >= 0 && room.taskIdx < TASKS.length) ? TASKS[room.taskIdx] : null;

  $('stageChip').textContent = curTask ? `P${curTask.phase} · ${curTask.label}` : (room?.locked === false ? 'Đã kết thúc' : 'Chưa bắt đầu');
  $('pauseBtn').textContent = room?.paused ? '▶ Tiếp tục' : '⏸ Tạm dừng';

  const doneCount = curTask ? list.filter(p => {
    if (curTask.id === 'bag_90s') return Array.isArray(p.bag) && p.bag.length > 0;
    if (curTask.id === 'vote_news') return Boolean(p.votedNews);
    if (curTask.id === 'news_after_vote') return Boolean(p.readNoticeAfterVote);
    if (curTask.id === 'board_decide') return p.prepared === true || p.prepared === false;
    if (curTask.id === 'checklist') return p.prepared !== true || (Array.isArray(p.priorityOrder) && p.priorityOrder.length === CHECKLIST.length);
    return true;
  }).length : 0;
  $('doneChip').textContent = `${doneCount} / ${list.length} hộ hoàn tất`;

  $('playerList').innerHTML = list.length ? list.map(p => {
    const dec = p.prepared === true
      ? 'Chủ động chuẩn bị & sơ tán'
      : (p.prepared === false ? 'Chờ thông tin chính xác hơn' : 'Chưa chọn');
    const readTxt = p.readNoticeAfterVote ? ' · Đã đọc tin' : '';
    return `<div class="pRow ${p.id === selectedPlayerId ? 'active' : ''}" onclick="selectedPlayerId='${p.id}';renderHost()">
      <div>
        <b>${esc(p.name)}</b> <span class="small">(${esc(p.profile?.title || '')})</span><br>
        <span class="small">${esc(dec)}${esc(readTxt)} · Ba lô: ${(p.bag || []).length} món</span>
      </div>
      <span class="pill">Xem</span>
    </div>`;
  }).join('') : `<div class="small">Chưa có hộ nào vào phòng.</div>`;

  const sel = list.find(x => x.id === selectedPlayerId) || list[0];
  if (sel) {
    selectedPlayerId = sel.id;
    const bagNames = (sel.bag || []).map(id => BAG_ITEMS.find(b => b.id === id)?.name || id).join(', ') || 'Chưa chọn';
    const prioSummary = (Array.isArray(sel.priorityOrder) && sel.priorityOrder.length)
      ? sel.priorityOrder.map((idx, pos) => `#${pos + 1}: ${CHECKLIST[idx]}`).join(' | ')
      : 'Chưa sắp xếp';
    const decisionText = sel.prepared === true
      ? 'Chủ động chuẩn bị ứng phó trước và sẵn sàng sơ tán'
      : (sel.prepared === false ? 'Bình tĩnh chờ đợi thêm những thông tin chính xác hơn' : 'Chưa chọn');

    $('inspector').innerHTML = `
      <b>🔍 Chi tiết hộ: ${esc(sel.name)}</b><br>
      <span class="small"><b>Thẻ vai:</b> ${esc(sel.profile?.title || '')} — ${esc(sel.profile?.membersText || '')}</span><br>
      <span class="small"><b>Ba lô:</b> ${esc(bagNames)}</span><br>
      <span class="small"><b>Vote tin:</b> ${esc(sel.votedNews || 'Chưa vote')} · <b>Đã đọc bảng tin sau vote:</b> ${sel.readNoticeAfterVote ? 'Có' : 'Chưa'}</span><br>
      <span class="small"><b>Phương án đã chọn:</b> ${esc(decisionText)}</span><br>
      <span class="small"><b>Thứ tự ưu tiên chuẩn bị:</b> ${esc(prioSummary)}</span>
    `;
  } else {
    $('inspector').innerHTML = 'Chọn một hộ ở trên để xem chi tiết.';
  }
}

function tickClock() {
  if (!room || !room.locked || room.taskIdx < 0 || room.taskIdx >= TASKS.length) {
    $('clock').textContent = room?.locked === false ? 'KẾT THÚC' : '00:00';
    return;
  }
  const rem = room.paused ? (room.remaining || 0) : Math.max(0, (room.deadline || 0) - Date.now());
  const sec = Math.ceil(rem / 1000);
  $('clock').textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}${room.paused ? ' ⏸' : ''}`;
}

initSelects();
DB.ref('room').on('value', (snap) => {
  room = snap.val() || {};
  renderHost();
});
setInterval(tickClock, 500);
</script>
</body>
</html>
